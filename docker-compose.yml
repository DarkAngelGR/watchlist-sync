# watchlist-sync. Start it with:  docker compose up -d
# Then open http://<server-ip>:8789 to sign in with Plex and connect Sonarr/Radarr/Bazarr.
services:
  watchlist-sync:
    image: ghcr.io/darkangelgr/watchlist-sync:latest
    # build: .                  # or build it from this folder instead
    container_name: watchlist-sync
    network_mode: host          # reaches Sonarr/Radarr/Bazarr on this machine and your LAN
    environment:
      - TZ=Europe/London        # your time zone
      # - UI_PASSWORD=change-me # optional: password-protect the web UI (recommended)
      # - PORT=8789
    volumes:
      - ./data:/data            # settings, Plex sign-in and history
    restart: unless-stopped
