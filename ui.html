<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist Sync</title>
<style>
:root{
  --bg:#f4f4f2; --card:#fff; --ink:#1b1c1e; --mute:#6b6e75; --line:#e3e3df;
  --accent:#e5a00d; --accent-ink:#1b1c1e; --ok:#1f8a4c; --warn:#b26a00; --bad:#c0392b; --chip:#efefeb;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141517;--card:#1c1d20;--ink:#ececea;--mute:#9a9ca3;--line:#2c2e33;--chip:#26282c;
        --ok:#4cc27e;--warn:#e0a03a;--bad:#ef6b5d}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
header .sp{flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--mute)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{filter:brightness(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.55;cursor:default}
.banner{border-left:4px solid var(--accent);padding:12px 16px}
.acct{display:flex;align-items:center;gap:12px}
.acct img{width:40px;height:40px;border-radius:50%;background:var(--chip)}
.big{font-size:26px;font-weight:650;line-height:1.1}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin:4px 0 8px}
.stats .l{font-size:12px;color:var(--mute)}
.mute{color:var(--mute)} .small{font-size:13px}
.err{color:var(--bad);font-size:13px;margin:4px 0 0;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip)}
.tag.added{color:var(--ok)} .tag.private,.tag.failed{color:var(--bad)} .tag.excluded{color:var(--mute)}
.scroll{overflow-x:auto}
form .row{display:grid;grid-template-columns:160px 1fr;gap:8px 12px;align-items:center;margin-bottom:9px}
@media (max-width:560px){form .row{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mute)}
input[type=text],input[type=password],input[type=number],select{width:100%;font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{color:var(--ink);font-size:14px;display:flex;gap:6px;align-items:center}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 6px;margin:0 0 12px}
legend{padding:0 6px;font-weight:600}
.testline{font-size:13px;margin:-2px 0 10px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.actions{display:flex;gap:10px;align-items:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Watchlist Sync</h1>
    <span id="statePill" class="pill">…</span>
    <span class="sp"></span>
    <button id="syncBtn" class="primary">Sync now</button>
  </header>

  <div id="banner" class="card banner hidden"></div>

  <div class="grid">
    <section class="card">
      <h2>Plex account</h2>
      <div id="acctBox"></div>
    </section>
    <section class="card">
      <h2>Last sync</h2>
      <div id="runBox" class="mute">No sync yet.</div>
    </section>
  </div>

  <section class="card">
    <h2>Users</h2>
    <div id="usersBox" class="mute small">Appears after the first sync.</div>
  </section>

  <section class="card">
    <h2 style="display:flex;align-items:center;gap:10px">Requests
      <span class="sp" style="flex:1"></span>
      <select id="userFilter" style="width:auto;text-transform:none;letter-spacing:0"><option value="">Everyone</option></select>
    </h2>
    <div class="scroll" id="reqBox"><span class="mute small">Nothing yet.</span></div>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <form id="settings" autocomplete="off">
      <fieldset>
        <legend>Sonarr <span class="mute small">(shows)</span></legend>
        <div class="row"><label>URL</label><input type="text" name="sonarr_url" placeholder="http://192.168.x.x:8989"></div>
        <div class="row"><label>API key</label><input type="password" name="sonarr_api_key" placeholder="Settings → General → API Key"></div>
        <div class="row"><label></label><div><button type="button" data-test="sonarr">Test &amp; load options</button></div></div>
        <div class="testline" id="test-sonarr"></div>
        <div class="row"><label>Quality profile</label><select name="sonarr_quality_profile"></select></div>
        <div class="row"><label>Root folder</label><select name="sonarr_root_folder"></select></div>
        <div class="row"><label>Monitor</label><select name="sonarr_monitor">
          <option value="all">All episodes</option><option value="future">Future episodes</option>
          <option value="missing">Missing episodes</option><option value="firstSeason">First season</option>
          <option value="latestSeason">Latest season</option><option value="pilot">Pilot only</option>
          <option value="none">None</option></select></div>
        <div class="row"><label>Series type</label><select name="sonarr_series_type">
          <option value="standard">Standard</option><option value="daily">Daily</option><option value="anime">Anime</option></select></div>
        <div class="row"><label></label><div class="checks"><label><input type="checkbox" name="sonarr_search"> Search as soon as added</label></div></div>
      </fieldset>

      <fieldset>
        <legend>Radarr <span class="mute small">(movies — optional)</span></legend>
        <div class="row"><label>URL</label><input type="text" name="radarr_url" placeholder="http://192.168.x.x:7878"></div>
        <div class="row"><label>API key</label><input type="password" name="radarr_api_key"></div>
        <div class="row"><label></label><div><button type="button" data-test="radarr">Test &amp; load options</button></div></div>
        <div class="testline" id="test-radarr"></div>
        <div class="row"><label>Quality profile</label><select name="radarr_quality_profile"></select></div>
        <div class="row"><label>Root folder</label><select name="radarr_root_folder"></select></div>
        <div class="row"><label>Minimum availability</label><select name="radarr_min_availability">
          <option value="announced">Announced</option><option value="inCinemas">In cinemas</option><option value="released">Released</option></select></div>
        <div class="row"><label></label><div class="checks"><label><input type="checkbox" name="radarr_search"> Search as soon as added</label></div></div>
      </fieldset>

      <fieldset>
        <legend>Bazarr <span class="mute small">(optional)</span></legend>
        <div class="row"><label>URL</label><input type="text" name="bazarr_url" placeholder="http://192.168.x.x:6767"></div>
        <div class="row"><label>API key</label><input type="password" name="bazarr_api_key" placeholder="Settings → General → Security"></div>
        <div class="row"><label></label><div><button type="button" data-test="bazarr">Test</button></div></div>
        <div class="testline" id="test-bazarr"></div>
      </fieldset>

      <fieldset>
        <legend>Sync</legend>
        <div class="row"><label>Every (minutes)</label><input type="number" min="1" name="interval_min" style="max-width:120px"></div>
        <div class="row"><label>Options</label><div class="checks">
          <label><input type="checkbox" name="include_owner"> My watchlist</label>
          <label><input type="checkbox" name="include_friends"> Friends' watchlists</label>
          <label><input type="checkbox" name="only_server_users"> Only friends with server access</label>
          <label><input type="checkbox" name="tag_by_user"> Tag by requester</label>
          <label><input type="checkbox" name="dry_run"> Dry run (don't add anything)</label>
        </div></div>
        <div class="row"><label>Only these users</label><input type="text" name="user_allow" placeholder="comma-separated, blank = everyone"></div>
        <div class="row"><label>Ignore these users</label><input type="text" name="user_block" placeholder="comma-separated"></div>
      </fieldset>

      <div class="actions"><button class="primary" type="submit">Save settings</button><span id="saveMsg" class="small mute"></span></div>
    </form>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opts={}) => {
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  return r.json();
};
const ago = ts => {
  if (!ts) return "";
  const s = Math.round(Date.now()/1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return new Date(ts*1000).toLocaleDateString();
};

let lastStatus = null;

function renderStatus(st){
  lastStatus = st;
  const pill = $("#statePill");
  if (st.running){ pill.textContent = "Syncing…"; pill.className = "pill warn"; }
  else if (st.problem){ pill.textContent = "Setup needed"; pill.className = "pill bad"; }
  else { pill.textContent = (st.dry_run ? "Dry run · " : "Active · ") + "every " + st.interval_min + " min"; pill.className = "pill " + (st.dry_run ? "warn" : "ok"); }

  const b = $("#banner");
  if (st.problem){ b.classList.remove("hidden"); b.innerHTML = "<strong>Almost there.</strong> " + esc(st.problem); }
  else if (st.dry_run){ b.classList.remove("hidden"); b.innerHTML = "<strong>Dry run is on.</strong> Nothing is being added yet — check the list below, then untick “Dry run” in Settings."; }
  else b.classList.add("hidden");

  // account
  const a = st.account;
  $("#acctBox").innerHTML = a
    ? `<div class="acct">${a.thumb ? `<img src="${esc(a.thumb)}" alt="">` : ""}<div><div><strong>${esc(a.username)}</strong></div>
       <div class="small mute">Signed in · reading your watchlist and your friends'</div></div></div>
       <div style="margin-top:12px"><button id="logoutBtn">Sign out</button></div>`
    : `<p class="small mute" style="margin-top:0">Sign in with the Plex account that owns the server. Plex opens in a new window; come back here when it says you're signed in.</p>
       <button class="primary" id="loginBtn">Sign in with Plex</button><div id="loginMsg" class="small mute" style="margin-top:8px"></div>`;
  if (a) $("#logoutBtn").onclick = logout; else $("#loginBtn").onclick = login;

  // last run
  const r = st.last_run || {};
  if (r.skipped) $("#runBox").innerHTML = `<span class="mute">${esc(r.skipped)}</span>`;
  else if (r.started){
    const verb = r.dry_run ? "Would add" : "Added";
    const list = [...(r.added_series||[]), ...(r.added_movies||[])];
    $("#runBox").innerHTML = `
      <div class="stats">
        <div><div class="big">${r.shows ?? 0}</div><div class="l">shows watchlisted</div></div>
        <div><div class="big">${r.movies ?? 0}</div><div class="l">movies watchlisted</div></div>
        <div><div class="big">${list.length}</div><div class="l">${verb.toLowerCase()}</div></div>
      </div>
      <div class="small mute">${ago(r.started)} · took ${r.duration_s ?? "?"}s</div>
      ${list.length ? `<div class="small" style="margin-top:6px">${verb}: ${list.map(esc).join(", ")}</div>` : ""}
      ${(r.errors||[]).map(e => `<div class="err">${esc(e)}</div>`).join("")}`;
  }

  // users
  if (st.users && st.users.length){
    const note = {ok:"", private:"Watchlist is private — they need to set Watchlist visibility to Friends in their Plex privacy settings", excluded:"Excluded in settings"};
    $("#usersBox").innerHTML = `<table><tr><th>User</th><th>Role</th><th>Watchlist</th><th></th></tr>${
      st.users.map(u => `<tr><td>${esc(u.name)}</td><td class="mute">${u.role}</td>
        <td>${u.items ?? "—"}</td><td><span class="tag ${u.status}">${u.status === "ok" ? "readable" : u.status}</span>
        ${note[u.status] ? `<div class="small mute">${note[u.status]}</div>` : ""}</td></tr>`).join("")}</table>`;
    $("#usersBox").classList.remove("mute","small");
  }

  // requests
  const f = $("#userFilter"), cur = f.value;
  const names = [...new Set((st.recent||[]).flatMap(x => x.users ? x.users.split(",") : []))].sort();
  f.innerHTML = `<option value="">Everyone</option>` + names.map(n => `<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
  renderRequests();
}

function renderRequests(){
  const st = lastStatus; if (!st) return;
  const who = $("#userFilter").value;
  const rows = (st.recent||[]).filter(x => !who || (x.users||"").split(",").includes(who));
  $("#reqBox").innerHTML = rows.length
    ? `<table><tr><th>Title</th><th>Where</th><th>Requested by</th><th>Result</th><th>When</th></tr>${
        rows.map(x => `<tr><td>${esc(x.title)}</td><td class="mute">${x.service === "sonarr" ? "Sonarr" : "Radarr"}</td>
          <td>${esc((x.users||"").split(",").join(", "))}</td>
          <td><span class="tag ${x.result === "added" ? "added" : ""}">${x.result === "added" ? "added" : "already there"}</span></td>
          <td class="mute small">${ago(x.ts)}</td></tr>`).join("")}</table>`
    : `<span class="mute small">Nothing yet.</span>`;
}

async function refresh(){ try { renderStatus(await api("/api/status")); } catch(e){} }

async function login(){
  const win = window.open("about:blank", "plexauth", "width=600,height=720");
  const msg = $("#loginMsg");
  msg.textContent = "Opening Plex…";
  const pin = await api("/api/plex/pin", {method:"POST"});
  if (pin.error){ msg.textContent = pin.error; if (win) win.close(); return; }
  if (win) win.location = pin.url; else window.open(pin.url, "_blank");
  msg.textContent = "Waiting for you to sign in to Plex…";
  const until = Date.now() + 10*60*1000;
  while (Date.now() < until){
    await new Promise(r => setTimeout(r, 2000));
    const res = await api("/api/plex/pin/" + pin.id);
    if (res.done){ if (win && !win.closed) win.close(); refresh(); return; }
    if (res.error){ msg.textContent = res.error; return; }
  }
  msg.textContent = "Timed out — try again.";
}

async function logout(){
  if (!confirm("Sign out of Plex? Syncing stops until you sign in again.")) return;
  await api("/api/plex/logout", {method:"POST"}); refresh();
}

// ---- settings form
const form = $("#settings");
function fillSelect(name, options, current, placeholder){
  const sel = form.elements[name];
  const opts = options.slice();
  if (current && !opts.some(o => o.value === current)) opts.unshift({value: current, label: current});
  sel.innerHTML = `<option value="">${placeholder}</option>` + opts.map(o =>
    `<option value="${esc(o.value)}" ${o.value === current ? "selected" : ""}>${esc(o.label)}</option>`).join("");
}
let settings = {};
async function loadSettings(){
  settings = await api("/api/settings");
  for (const el of form.elements){
    if (!el.name) continue;
    if (el.type === "checkbox") el.checked = !!settings[el.name];
    else if (el.type === "password") el.placeholder = settings[el.name + "_set"] ? "•••••••• saved (leave blank to keep)" : el.placeholder;
    else if (el.tagName !== "SELECT" || el.options.length) el.value = settings[el.name] ?? "";
  }
  for (const svc of ["sonarr","radarr"]){
    fillSelect(svc + "_quality_profile", [], settings[svc + "_quality_profile"], "First profile (press Test to choose)");
    fillSelect(svc + "_root_folder", [], settings[svc + "_root_folder"], "First root folder (press Test to choose)");
  }
  form.elements.sonarr_monitor.value = settings.sonarr_monitor;
  form.elements.sonarr_series_type.value = settings.sonarr_series_type;
  form.elements.radarr_min_availability.value = settings.radarr_min_availability;
}

form.querySelectorAll("[data-test]").forEach(btn => btn.onclick = async () => {
  const svc = btn.dataset.test, out = $("#test-" + svc);
  out.className = "testline mute"; out.textContent = "Testing…";
  const res = await api("/api/test/" + svc, {method:"POST", body: JSON.stringify({
    url: form.elements[svc + "_url"].value, api_key: form.elements[svc + "_api_key"].value})});
  if (!res.ok){ out.className = "testline bad"; out.textContent = res.error || "Failed"; return; }
  out.className = "testline ok"; out.textContent = "Connected" + (res.version ? " · v" + res.version : "");
  if (res.profiles){
    const curP = form.elements[svc + "_quality_profile"].value, curR = form.elements[svc + "_root_folder"].value;
    fillSelect(svc + "_quality_profile", res.profiles.map(p => ({value:p.name, label:p.name})), curP, "First profile");
    fillSelect(svc + "_root_folder", res.roots.map(p => ({value:p, label:p})), curR, "First root folder");
  }
});

form.onsubmit = async e => {
  e.preventDefault();
  const data = {};
  for (const el of form.elements){
    if (!el.name) continue;
    data[el.name] = el.type === "checkbox" ? el.checked : el.value;
  }
  const msg = $("#saveMsg"); msg.textContent = "Saving…";
  await api("/api/settings", {method:"POST", body: JSON.stringify(data)});
  form.querySelectorAll("input[type=password]").forEach(i => i.value = "");
  await loadSettings();
  msg.textContent = "Saved — syncing now.";
  setTimeout(() => msg.textContent = "", 4000);
  refresh();
};

$("#syncBtn").onclick = async () => { await api("/api/sync", {method:"POST"}); setTimeout(refresh, 800); };
$("#userFilter").onchange = renderRequests;

loadSettings(); refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
