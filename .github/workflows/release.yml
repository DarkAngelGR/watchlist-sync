# Publishes a release whenever VERSION in app.py changes on main: runs the
# tests, pushes the Docker image to GitHub's registry
# (ghcr.io/<owner>/watchlist-sync:<version> and :latest, for amd64 and arm64),
# and creates a GitHub release with the commit message as notes.
name: Release

on:
  push:
    branches: [main]
    paths: [app.py, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          V=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' app.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test
        if: steps.v.outputs.exists != 'true'
        run: |
          pip install -r requirements.txt
          python test_app.py

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.exists != 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        if: steps.v.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Publish the release
        if: steps.v.outputs.exists != 'true'
        run: |
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md
          printf '\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$V" >> notes.md
          gh release create "v$V" --title "watchlist-sync $V" --notes-file notes.md --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
